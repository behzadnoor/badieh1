<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>راه بادیه مجازی</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🌵%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>🌵 راه بادیه مجازی</h1>
    <p class="sub">فضایی برای گفتگو، تبادل نظر و اشتراک‌گذاری دانش</p>
    <div class="tabs">
      <button id="tabLogin" class="tab active">ورود</button>
      <button id="tabRegister" class="tab">ثبت‌نام</button>
    </div>
    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="نام کاربری" required>
      <input type="password" id="loginPassword" placeholder="رمز عبور" required>
      <button type="submit">ورود</button>
      <p class="err" id="loginErr"></p>
    </form>
    <form id="registerForm" style="display:none">
      <input type="text" id="regDisplayName" placeholder="نام نمایشی" required>
      <input type="text" id="regUsername" placeholder="نام کاربری" required>
      <input type="tel" id="regPhone" placeholder="شماره موبایل (مثال: 0912xxxxxxx)" required>
      <input type="password" id="regPassword" placeholder="رمز عبور (حداقل ۴ کاراکتر)" required>
      <input type="password" id="regConfirmPassword" placeholder="تکرار رمز عبور" required>
      <button type="submit">ثبت‌نام</button>
      <p class="hint">اولین کسی که ثبت‌نام کنه، خودکار مدیر سایت می‌شه. بقیه تا زمان تایید مدیر فقط می‌تونن بخونن.</p>
      <p class="err" id="regErr"></p>
    </form>
  </div>
</div>

<div id="appScreen" class="app-screen" style="display:none">
  <header>
    <div class="brand"><span class="logo">🌵</span><h1>راه بادیه مجازی</h1></div>
    <input id="searchBox" type="search" placeholder="🔍 جستجو در پیام‌ها...">
    <div class="hactions">
      <span id="whoami"></span>
      <button class="ghost" id="dmBtn">💬 گفتگوی جدید</button>
      <button class="ghost" id="themeColorBtn">🎨 رنگ</button>
      <button class="ghost" id="themeToggleBtn">🌓</button>
      <button class="ghost" id="adminBtn" style="display:none">⚙️ مدیریت</button>
      <button class="ghost" id="logoutBtn">خروج</button>
    </div>
  </header>
  <div class="wrap">
    <aside class="card side">
      <h3>📂 تالارها</h3>
      <div id="topicList"></div>
      <button class="ghost" id="newTopicBtn" style="display:none">＋ ایجاد تاپیک جدید</button>
      <h3>💬 گفتگوهای خصوصی</h3>
      <div id="convList"></div>
      <button class="ghost" id="newConvBtn">＋ گفتگوی جدید</button>
      <div id="allConvsBox" style="display:none">
        <h3>🔒 همه‌ی گفتگوها (فقط مدیر اصلی)</h3>
        <div id="allConvList"></div>
      </div>
    </aside>
    <main class="card main" id="mainArea"></main>
    <aside class="card side">
      <h3>👥 اعضای آنلاین</h3>
      <div id="onlineList"></div>
    </aside>
  </div>
</div>

<div id="modalRoot"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
